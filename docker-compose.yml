services:
  hub:
    build: .
    command: python hub.py
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./monitoring.db:/app/monitoring.db

  server-1:
    build: .
    command: python collector_agent.py
    network_mode: host
    restart: unless-stopped
    environment:
      - SERVER_NAME=web-server-1

  server-2:
    build: .
    command: python collector_agent.py
    network_mode: host
    restart: unless-stopped
    environment:
      - SERVER_NAME=database-server-2

  server-3:
    build: .
    command: python collector_agent.py
    network_mode: host
    restart: unless-stopped
    environment:
      - SERVER_NAME=cache-server-3

  bot:
    build: .
    command: python bot.py
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./monitoring.db:/app/monitoring.db
      - ./config.py:/app/config.py:ro
      - /tmp/log_analysis.txt:/tmp/log_analysis.txt:ro

  web:
    build: .
    command: python -m uvicorn web:app --host 0.0.0.0 --port 8000
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./monitoring.db:/app/monitoring.db:ro
