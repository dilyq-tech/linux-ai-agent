services:
  collector:
    build: .
    command: python collector.py
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./monitoring.db:/app/monitoring.db

  bot:
    build: .
    command: python bot.py
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./monitoring.db:/app/monitoring.db
      - ./config.py:/app/config.py:ro

  web:
    build: .
    command: python -m uvicorn web:app --host 0.0.0.0 --port 8000
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./monitoring.db:/app/monitoring.db:ro
