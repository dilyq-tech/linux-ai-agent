x-app: &app
  image: ai-sysadmin:alpine
  build:
    context: .
    target: runtime

services:
  hub:
    <<: *app
    command: python hub.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9000), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - monitoring_net
    volumes:
      - ./monitoring.db:/app/monitoring.db

  server-1:
    <<: *app
    command: python collector_agent.py
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    networks:
      - monitoring_net
    environment:
      SERVER_NAME: web-server-1
      HUB_URL: http://hub:9000/metrics

  bot:
    <<: *app
    image: ai-sysadmin:bot
    build:
      context: .
      target: bot
    command: python bot.py
    restart: unless-stopped
    networks:
      - monitoring_net
    volumes:
      - ./monitoring.db:/app/monitoring.db
      - ./config.py:/app/config.py:ro
      - /tmp/log_analysis.txt:/tmp/log_analysis.txt:ro
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    <<: *app
    command: python -m uvicorn web:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - monitoring_net
    ports:
      - "8000:8000" # Обязательно для доступа к веб-интерфейсу извне после смены сети
    volumes:
      - ./monitoring.db:/app/monitoring.db:ro

# Общая пользовательская сеть
networks:
  monitoring_net:
    driver: bridge
